    cwe: CWE-693
    invariant: INV-D6-20
    description: "Cross-tenant scope inferred without explicit proof."
  - id: SDV-015
    name: CROSS_SERVICE_CONTAMINATION
    cwe: CWE-693
    invariant: INV-D6-21
    description: "Cross-service scope inferred without explicit proof."
  - id: SDV-016
    name: DECISION_CORRELATION_CONFLICT
    cwe: CWE-693
    invariant: INV-D6-14
    description: "Conflict during decision candidate correlation."
  - id: SDV-017
    name: UNKNOWN_SECURITY_DECISION_STATE
    cwe: CWE-693
    invariant: INV-D6-13
    description: "Unresolvable decision state defaulted to UNKNOWN."
