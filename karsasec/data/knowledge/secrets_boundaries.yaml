secrets_boundaries:
  - id: SOURCE_CODE
    trust_level: INTERNAL_CODEBASE
    description: In-repo source code files and internal constant declarations

  - id: ENVIRONMENT_VARIABLE
    trust_level: CONFIG_ENVIRONMENT
    description: Host process environment variables and deployment configs

  - id: CONFIG_FILE
    trust_level: CONFIG_FILE
    description: Static application configuration files (yaml, json, ini, env)

  - id: CI_CD_SYSTEM
    trust_level: PIPELINE_BUILD
    description: Continuous integration pipeline configuration and build logs

  - id: SECRET_MANAGER
    trust_level: SECURE_VAULT
    description: Hardware security module or dedicated secret store (HashiCorp Vault, AWS Secrets Manager)

  - id: LOG_FILE
    trust_level: OPERATIONAL_LOGS
    description: Application and system log outputs

  - id: HTTP_RESPONSE
    trust_level: EXTERNAL_UNTRUSTED
    description: Outbound HTTP server response body or response headers

  - id: GIT_REPOSITORY
    trust_level: SOURCE_CONTROL
    description: Version control commit history and public repositories

  - id: DATABASE
    trust_level: SENSITIVE_STORAGE
    description: Persistent relational or NOSQL datastores

  - id: OBJECT_STORAGE
    trust_level: CLOUD_STORAGE
    description: Cloud object storage buckets (S3, GCS, Blob Storage)
