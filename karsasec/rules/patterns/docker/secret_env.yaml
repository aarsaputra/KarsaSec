rule:
  id: KS-DOCKER-0005

metadata:
  name: Dockerfile Hardcoded Secret in ENV or ARG
  author: KarsaSec Team
  version: "2.0"
  cwe: CWE-798
  owasp: A07:2021-Identification and Authentication Failures
  created: "2026-08-05"
  references:
    - https://cwe.mitre.org/data/definitions/798.html
  tags:
    - docker
    - secret
    - iac

target:
  languages:
    - Dockerfile

analysis:
  engine: AST
  behavior: SINK

match:
  language: Dockerfile
  ast_node_types:
    - statement
    - call

condition:
  symbol_triggers:
    - ENV
    - ARG
  pattern: "(?i)(ENV|ARG)\\s+.*(PASSWORD|SECRET|TOKEN|KEY|APIKEY)\\s*="

evidence:
  require: []
  score_weights:
    dangerous_sink: 50

output:
  severity: HIGH
  confidence: CONFIDENT
  message: Hardcoded credentials or tokens exposed in ENV or ARG instructions.
  remediation: Inject secrets at runtime using container secrets management or environment variables at launch.
