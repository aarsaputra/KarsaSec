rule:
  id: KS-PY-0001

metadata:
  name: Python SQL Injection
  author: KarsaSec
  version: "1.0"
  enabled: true
  experimental: false
  cwe: CWE-89
  owasp: A03:2021-Injection

match:
  language: Python
  ast_node_types:
    - call

condition:
  symbol_triggers:
    - execute
    - executemany
    - raw

output:
  severity: HIGH
  confidence: CONFIDENT
  message: Detects execution of raw SQL queries vulnerable to SQL Injection.
  remediation: Use parameterized queries or ORM query builders.
