rule:
  id: KS-FLASK-AUTH-0001
  version: "1.0"
  framework: FLASK

metadata:
  name: Unprotected Route Policy
  author: KarsaSec Team
  cwe: CWE-306
  owasp: A07:2021-Identification and Authentication Failures
  references:
    - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/

target:
  node_type: ROUTE

conditions:
  all:
    - incoming_edge:
        type: HANDLES
    - not:
        any:
          - incoming_edge:
              type: PROTECTS
              source_type: AUTH
          - incoming_edge:
              type: PROTECTS
              source_type: MIDDLEWARE

traversal:
  max_depth: 1
  max_nodes_visited: 50
  max_edges_examined: 100

output:
  severity: HIGH
  confidence: HIGH
  message: Route '{node.name}' handles incoming requests but has no attached AUTH or MIDDLEWARE protection edge.
  remediation: Apply an authentication decorator (@login_required, @jwt_required) or attach an authentication middleware.
