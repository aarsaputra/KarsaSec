rule:
  id: KS-FLASK-CONF-0002
  version: "1.0"
  framework: FLASK

metadata:
  name: Secret Key Explicitly Hardcoded
  author: KarsaSec Team
  cwe: CWE-798
  owasp: A07:2021-Identification and Authentication Failures
  references:
    - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/

target:
  node_type: CONFIG

conditions:
  all:
    - attribute_equals:
        key: key
        value: SECRET_KEY
    - attribute_equals:
        key: source_kind
        value: literal

traversal:
  max_depth: 1
  max_nodes_visited: 10
  max_edges_examined: 20

output:
  severity: HIGH
  confidence: HIGH
  message: Configuration SECRET_KEY is explicitly hardcoded as a literal string in application code.
  remediation: Load SECRET_KEY from environment variables (e.g. os.environ.get('SECRET_KEY')).
