rule:
  id: KS-FLASK-AUTH-0003
  version: "1.0"
  framework: FLASK

metadata:
  name: Weak Authentication Mechanism
  author: KarsaSec Team
  cwe: CWE-287
  owasp: A07:2021-Identification and Authentication Failures
  references:
    - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/

target:
  node_type: AUTH

conditions:
  all:
    - attribute_equals:
        key: auth_strength
        value: WEAK

traversal:
  max_depth: 1
  max_nodes_visited: 10
  max_edges_examined: 20

output:
  severity: HIGH
  confidence: HIGH
  message: Authentication provider '{node.name}' uses a weak authentication mechanism.
  remediation: Upgrade authentication mechanism to a robust provider (e.g. JWT with strong signature, Session with cookie protection).
