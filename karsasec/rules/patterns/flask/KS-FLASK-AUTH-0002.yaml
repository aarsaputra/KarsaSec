rule:
  id: KS-FLASK-AUTH-0002
  version: "1.0"
  framework: FLASK

metadata:
  name: Sensitive Endpoint Missing Authentication
  author: KarsaSec Team
  cwe: CWE-306
  owasp: A07:2021-Identification and Authentication Failures
  references:
    - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/

target:
  node_type: ROUTE

conditions:
  all:
    - attribute_equals:
        key: sensitivity
        value: HIGH
    - not:
        any:
          - incoming_edge:
              type: PROTECTS
              source_type: AUTH
          - incoming_edge:
              type: PROTECTS
              source_type: MIDDLEWARE

traversal:
  max_depth: 1
  max_nodes_visited: 50
  max_edges_examined: 100

output:
  severity: CRITICAL
  confidence: HIGH
  message: High-sensitivity route '{node.name}' lacks attached AUTH or MIDDLEWARE protection edge.
  remediation: Enforce authentication decorator (@login_required, @jwt_required) or middleware on sensitive endpoint.
