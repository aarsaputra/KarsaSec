rule:
  id: KS-FLASK-CONF-0004
  version: "1.0"
  framework: FLASK

metadata:
  name: Hardcoded Secret Key Assignment
  author: KarsaSec Team
  cwe: CWE-798
  owasp: A07:2021-Identification and Authentication Failures
  references:
    - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/

target:
  node_type: CONFIG

conditions:
  all:
    - attribute_equals:
        key: key
        value: SECRET_KEY
    - attribute_equals:
        key: source_kind
        value: literal
    - attribute_equals:
        key: provenance_type
        value: assignment

traversal:
  max_depth: 1
  max_nodes_visited: 10
  max_edges_examined: 20

output:
  severity: HIGH
  confidence: HIGH
  message: Secret key configuration '{node.name}' uses a hardcoded literal value assignment.
  remediation: Load SECRET_KEY dynamically from environment variables or a secure secret vault (e.g. os.environ['SECRET_KEY']).
