rule:
  id: KS-PY-0002

metadata:
  name: Python Command Injection
  author: KarsaSec
  version: "1.0"
  enabled: true
  experimental: false
  cwe: CWE-78
  owasp: A03:2021-Injection

match:
  language: Python
  ast_node_types:
    - call

condition:
  symbol_triggers:
    - os.system
    - os.popen
    - subprocess.call
    - subprocess.Popen

output:
  severity: HIGH
  confidence: CONFIDENT
  message: Detects execution of OS commands with un-sanitized input.
  remediation: Use subprocess.run with argument lists instead of shell=True.
