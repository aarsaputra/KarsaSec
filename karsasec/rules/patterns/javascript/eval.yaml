rule:
  id: KS-JS-0001

metadata:
  name: JavaScript Eval Injection
  author: KarsaSec Team
  version: "2.0"
  cwe: CWE-95
  owasp: A03:2021-Injection
  created: "2026-08-05"
  references:
    - https://cwe.mitre.org/data/definitions/95.html
  tags:
    - injection
    - eval
    - javascript

target:
  languages:
    - JavaScript
    - TypeScript

analysis:
  engine: AST
  behavior: SINK

match:
  language: JavaScript
  ast_node_types:
    - call
    - call_expression
    - expression_statement

condition:
  symbol_triggers:
    - eval
    - vm.runInThisContext

evidence:
  require:
    - user_input
  score_weights:
    dangerous_sink: 50

output:
  severity: CRITICAL
  confidence: CONFIDENT
  message: Detects execution of dynamic string code evaluation via eval.
  remediation: Refactor code to eliminate dynamic string execution. Use JSON parsing or structured handlers.
