rule:
  id: KS-JS-0031

metadata:
  name: JavaScript Deprecated Function Usage
  author: KarsaSec Team
  version: "2.0"
  cwe: CWE-477
  owasp: A04:2021-Insecure Design
  created: "2026-08-27"
  references:
    - https://cwe.mitre.org/data/definitions/477.html
  tags:
    - code_smell
    - deprecated
    - javascript

target:
  languages:
    - JavaScript
    - TypeScript

analysis:
  engine: AST
  behavior: PATTERN

match:
  language: JavaScript
  ast_node_types:
    - call_expression
    - expression_statement

condition:
  symbol_triggers:
    - escape
    - unescape
  pattern: "(?i)(?:^|[^a-zA-Z0-9_])(escape|unescape)\\("

output:
  severity: INFO
  confidence: CONFIDENT
  message: Use of deprecated global escape() or unescape() functions.
  remediation: Replace escape()/unescape() with encodeURIComponent() / decodeURIComponent().
