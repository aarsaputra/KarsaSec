rules:
  - rule:
      id: KS-GO-0018
    metadata:
      name: Go Fiber Unsanitized Command Injection
      author: KarsaSec Team
      version: "1.0"
      cwe: CWE-78
      owasp: A03:2021-Injection
      created: "2026-08-06"
      references:
        - https://cwe.mitre.org/data/definitions/78.html
      tags:
        - cmdi
        - fiber
        - framework
        - go
    target:
      languages:
        - Go
    analysis:
      engine: AST
      behavior: SINK
    match:
      language: Go
      ast_node_types:
        - call
    condition:
      symbol_triggers:
        - exec.Command
        - c.FormValue
        - c.Query
      pattern: "(?i)exec\\.Command\\s*\\([^)]*c\\.(?:FormValue|Query|Params)"
    evidence:
      require:
        - user_input
      score_weights:
        dangerous_sink: 50
        user_source: 30
    output:
      severity: CRITICAL
      confidence: CONFIDENT
      message: Executing system commands with input parameters from Fiber context causes remote command injection.
      remediation: Avoid shell invocation; strictly validate inputs against alphanumeric allowlists.

  - rule:
      id: KS-GO-0019
    metadata:
      name: Go Fiber Path Traversal via SendFile
      author: KarsaSec Team
      version: "1.0"
      cwe: CWE-22
      owasp: A01:2021-Broken Access Control
      created: "2026-08-06"
      references:
        - https://cwe.mitre.org/data/definitions/22.html
      tags:
        - path_traversal
        - fiber
        - go
    target:
      languages:
        - Go
    analysis:
      engine: AST
      behavior: SINK
    match:
      language: Go
      ast_node_types:
        - call
    condition:
      symbol_triggers:
        - c.SendFile
        - c.Params
      pattern: "(?i)c\\.SendFile\\s*\\([^)]*c\\.(?:Params|Query|FormValue)"
    evidence:
      require:
        - user_input
      score_weights:
        dangerous_sink: 40
        user_source: 30
    output:
      severity: HIGH
      confidence: CONFIDENT
      message: Passing Fiber path parameters directly into c.SendFile allows directory traversal and unauthorized file reads.
      remediation: Use filepath.Clean and verify the resolved path remains within the dedicated public storage folder.

  - rule:
      id: KS-GO-0020
    metadata:
      name: Go Fiber Hardcoded Session Secret
      author: KarsaSec Team
      version: "1.0"
      cwe: CWE-798
      owasp: A07:2021-Identification and Authentication Failures
      created: "2026-08-06"
      references:
        - https://cwe.mitre.org/data/definitions/798.html
      tags:
        - secret
        - fiber
        - session
        - go
    target:
      languages:
        - Go
    analysis:
      engine: AST
      behavior: SINK
    match:
      language: Go
      ast_node_types:
        - call
        - assignment
    condition:
      symbol_triggers:
        - session.New
        - KeyLookup
      pattern: "(?i)(?:Secret|KeyLookup|Key)\\s*:\\s*[\"'][^\"']{3,}[\"']"
    evidence:
      score_weights:
        dangerous_sink: 30
    output:
      severity: MEDIUM
      confidence: CONFIDENT
      message: Hardcoding Fiber session keys or cookie encryption secrets permits session hijacking and tampering.
      remediation: Retrieve session secret keys dynamically from environment configuration variables.
