rule:
  id: KS-GO-0004

metadata:
  name: Go Path Traversal
  author: KarsaSec Team
  version: "2.0"
  cwe: CWE-22
  owasp: A01:2021-Broken Access Control
  created: "2026-08-05"
  references:
    - https://cwe.mitre.org/data/definitions/22.html
  tags:
    - path_traversal
    - filesystem
    - go

target:
  languages:
    - Go
  frameworks:
    - os
    - io/ioutil

analysis:
  engine: AST
  behavior: SINK

match:
  language: Go
  ast_node_types:
    - call_expression
    - call
    - statement

condition:
  symbol_triggers:
    - os.Open
    - os.OpenFile
    - os.ReadFile
    - ioutil.ReadFile
  pattern: "(?i)(os\\.(?:Open|OpenFile|ReadFile)|ioutil\\.ReadFile)"

evidence:
  require:
    - user_input
  score_weights:
    dangerous_sink: 40
    user_source: 30

output:
  severity: HIGH
  confidence: CONFIDENT
  message: Detects file opening or reading utilizing unsanitized path strings in Go.
  remediation: Clean and sanitize file path arguments using filepath.Clean and ensure they remain within authorized directories.
