rules:
  - rule:
      id: KS-GO-0015
    metadata:
      name: Go Echo QueryParam Raw SQL Injection
      author: KarsaSec Team
      version: "1.0"
      cwe: CWE-89
      owasp: A03:2021-Injection
      created: "2026-08-06"
      references:
        - https://cwe.mitre.org/data/definitions/89.html
      tags:
        - sqli
        - echo
        - framework
        - go
    target:
      languages:
        - Go
    analysis:
      engine: AST
      behavior: SINK
    match:
      language: Go
      ast_node_types:
        - call
    condition:
      symbol_triggers:
        - c.QueryParam
        - c.FormValue
        - db.Query
      pattern: "(?i)(?:db\\.Query|db\\.Exec|db\\.QueryRow)\\s*\\([^)]*c\\.(?:QueryParam|FormValue|Param)"
    evidence:
      require:
        - user_input
      score_weights:
        dangerous_sink: 50
        user_source: 30
    output:
      severity: HIGH
      confidence: CONFIDENT
      message: Concatenating Echo context parameters into raw SQL queries creates SQL injection vulnerabilities.
      remediation: Use parameterized query placeholders ($1, ?, etc.) or an ORM with proper parameter binding.

  - rule:
      id: KS-GO-0016
    metadata:
      name: Go Echo Inline Unescaped HTML Output XSS
      author: KarsaSec Team
      version: "1.0"
      cwe: CWE-79
      owasp: A03:2021-Injection
      created: "2026-08-06"
      references:
        - https://cwe.mitre.org/data/definitions/79.html
      tags:
        - xss
        - echo
        - go
    target:
      languages:
        - Go
    analysis:
      engine: AST
      behavior: SINK
    match:
      language: Go
      ast_node_types:
        - call
    condition:
      symbol_triggers:
        - c.HTML
        - fmt.Sprintf
      pattern: "(?i)c\\.HTML\\s*\\([^,]+,\\s*fmt\\.Sprintf\\s*\\([^)]*c\\.(?:QueryParam|FormValue)"
    evidence:
      require:
        - user_input
      score_weights:
        dangerous_sink: 40
        user_source: 30
    output:
      severity: HIGH
      confidence: CONFIDENT
      message: Rendering formatted HTML directly with request parameters in Echo bypasses context-aware escaping.
      remediation: Use html/template engine rendering (c.Render) or sanitize inputs using html.EscapeString.

  - rule:
      id: KS-GO-0017
    metadata:
      name: Go Echo Hardcoded JWT Secret Key
      author: KarsaSec Team
      version: "1.0"
      cwe: CWE-798
      owasp: A07:2021-Identification and Authentication Failures
      created: "2026-08-06"
      references:
        - https://cwe.mitre.org/data/definitions/798.html
      tags:
        - secret
        - jwt
        - echo
        - go
    target:
      languages:
        - Go
    analysis:
      engine: AST
      behavior: SINK
    match:
      language: Go
      ast_node_types:
        - call
        - assignment
    condition:
      symbol_triggers:
        - SigningKey
        - jwt.WithKey
      pattern: "(?i)(?:SigningKey|jwt\\.WithKey)\\s*:\\s*\\[\\]byte\\s*\\(\\s*[\"'][^\"']{3,}[\"']\\s*\\)"
    evidence:
      score_weights:
        dangerous_sink: 40
    output:
      severity: HIGH
      confidence: CONFIDENT
      message: Hardcoding secret signing keys for JWT middleware allows attackers to forge authorization tokens.
      remediation: Load JWT secret keys from secure environment variables or a key management vault.
