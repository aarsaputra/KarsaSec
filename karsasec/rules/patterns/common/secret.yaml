rule:
  id: KS-COMMON-0001

metadata:
  name: Hardcoded Secrets Detection
  author: KarsaSec Team
  version: "2.0"
  cwe: CWE-798
  owasp: A07:2021-Identification and Authentication Failures
  created: "2026-08-05"
  references:
    - https://cwe.mitre.org/data/definitions/798.html
  tags:
    - secret
    - credential
    - common

target:
  languages:
    - Python
    - JavaScript
    - PHP
    - Go

analysis:
  engine: PATTERN
  behavior: SINK

match:
  language: Python
  ast_node_types:
    - assignment
    - assign
    - statement
    - string

condition:
  pattern: "(?i)(api_key|secret_key|jwt_secret|aws_secret)\\s*=\\s*['\"][A-Za-z0-9/+=_-]{16,}['\"]"

evidence:
  require:
    - hardcoded_string
  score_weights:
    dangerous_sink: 40

output:
  severity: HIGH
  confidence: CONFIDENT
  message: Detects hardcoded secret tokens, private keys, or credentials stored in source files.
  remediation: Store credentials in environment variables or a secure key vault (e.g. HashiCorp Vault).
