rule:
  id: KS-OWASP-0010

metadata:
  references:
    - https://owasp.org/Top10/
  name: OWASP A10 - Server-Side Request Forgery (SSRF)
  author: KarsaSec Team
  version: "1.0"
  cwe: CWE-918
  owasp: A10:2021-Server-Side Request Forgery (SSRF)
  created: "2026-08-05"
  tags:
    - ssrf

target:
  languages:
    - PHP
    - Python
    - JavaScript
    - Go

analysis:
  engine: AST
  behavior: SINK

match:
  language: Generic
  ast_node_types:
    - call

condition:
  symbol_triggers:
    - file_get_contents
    - requests.get
    - axios
    - fetch
    - curl
  pattern: '(?i)(file_get_contents|requests\.get|axios|fetch|cURL)'

evidence:
  require: []
  score_weights:
    dangerous_sink: 30

output:
  severity: HIGH
  confidence: LIKELY
  message: Detects outbound HTTP requests using unvalidated user input.
  remediation: Enforce strict URL whitelisting and block internal network ranges (127.0.0.1, 169.254.169.254).
