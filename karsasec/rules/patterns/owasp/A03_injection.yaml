rule:
  id: KS-OWASP-0003

metadata:
  references:
    - https://owasp.org/Top10/
  name: OWASP A03 - Injection (Multi-language)
  author: KarsaSec Team
  version: "1.1"
  cwe: CWE-74
  owasp: A03:2021-Injection
  created: "2026-08-05"
  updated: "2026-08-09"
  tags:
    - injection

target:
  languages:
    - PHP
    - Python
    - JavaScript
    - Go

analysis:
  engine: AST
  behavior: SINK

match:
  language: Generic
  ast_node_types:
    - call

condition:
  symbol_triggers:
    - exec
    - system
    - shell_exec
    - popen
    - query
    - eval
  pattern: '(?i)(shell_exec\s*\(|exec\s*\(|system\s*\(|popen\s*\(|mysqli_query\s*\(|eval\s*\(|child_process)'
  # Candidate pre-filter: exclude JS obfuscation minifier patterns and comments
  node_text_not_matches: '(eval\s*\(\s*function\s*\(|//|<!--|\*\s|#\s)'

evidence:
  require:
    - user_input
  score_weights:
    dangerous_sink: 30

output:
  severity: CRITICAL
  confidence: LIKELY
  message: Detects dangerous sink invocation without adequate validation causing command, SQL, or code injection.
  remediation: Parameterize all database queries, escape command arguments with escapeshellarg(), or avoid dynamic command/code evaluation.
