rule:
  id: KS-OWASP-0003

metadata:
  references:
    - https://owasp.org/Top10/
  name: OWASP A03 - Injection (Multi-language)
  author: KarsaSec Team
  version: "1.0"
  cwe: CWE-74
  owasp: A03:2021-Injection
  created: "2026-08-05"
  tags:
    - injection

target:
  languages:
    - PHP
    - Python
    - JavaScript
    - Go

analysis:
  engine: AST
  behavior: SINK

match:
  language: Generic
  ast_node_types:
    - call
    - statement

condition:
  symbol_triggers:
    - exec
    - system
    - popen
    - query
    - eval
  pattern: '(?i)(exec|system|popen|mysqli_query|eval|child_process)'

evidence:
  require: []
  score_weights:
    dangerous_sink: 30

output:
  severity: CRITICAL
  confidence: LIKELY
  message: Detects dangerous sink invocation without adequate validation causing command, SQL, or code injection.
  remediation: Parameterize all database queries, escape command arguments, or avoid dynamic command/code evaluation.
