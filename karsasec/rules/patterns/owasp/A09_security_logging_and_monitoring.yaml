rule:
  id: KS-OWASP-0009

metadata:
  name: OWASP A09 - Security Logging and Monitoring Failures
  author: KarsaSec Team
  version: "1.0"
  cwe: CWE-778
  owasp: A09:2021-Security Logging and Monitoring Failures
  created: "2026-08-05"
  tags:
    - logging

target:
  languages:
    - PHP
    - Python
    - JavaScript
    - Go

analysis:
  engine: AST
  behavior: SINK

match:
  language: Generic
  ast_node_types:
    - call

condition:
  symbol_triggers:
    - log
    - logging
    - error_log
  pattern: '(?i)(log|logging|error_log|audit)'

evidence:
  require: []
  score_weights:
    dangerous_sink: 20

output:
  severity: LOW
  confidence: POSSIBLE
  message: Verify that critical authentication or state events are properly audited and logged.
  remediation: Implement centralized audit logging for all security-relevant actions.
