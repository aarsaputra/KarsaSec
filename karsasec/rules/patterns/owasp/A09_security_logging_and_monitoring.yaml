rule:
  id: KS-OWASP-0009

metadata:
  references:
    - https://owasp.org/Top10/
  name: OWASP A09 - Security Logging and Monitoring Failures
  author: KarsaSec Team
  version: "1.0"
  cwe: CWE-778
  owasp: A09:2021-Security Logging and Monitoring Failures
  created: "2026-08-05"
  tags:
    - logging

target:
  languages:
    - PHP
    - Python
    - JavaScript
    - Go

analysis:
  engine: AST
  behavior: SINK

match:
  language: Generic
  ast_node_types:
    - call

condition:
  symbol_triggers:
    - unlogged_auth_failure
    - missing_audit_log
  pattern: '(?i)(unlogged_auth_failure|missing_audit_log)'
  value_evidence_not_in:
    - ENV_REFERENCE
    - SECRET_PROVIDER_REFERENCE
    - EMPTY_LITERAL
    - NULL_LITERAL
    - STATIC_CONSTANT

evidence:
  require: []
  score_weights:
    dangerous_sink: 20

output:
  severity: LOW
  confidence: POSSIBLE
  message: Verify that critical authentication or state events are properly audited and logged.
  remediation: Implement centralized audit logging for all security-relevant actions.
