rule:
  id: KS-OWASP-0008

metadata:
  references:
    - https://owasp.org/Top10/
  name: OWASP A08 - Software and Data Integrity Failures / Insecure Deserialization
  author: KarsaSec Team
  version: "1.0"
  cwe: CWE-502
  owasp: A08:2021-Software and Data Integrity Failures
  created: "2026-08-05"
  tags:
    - deserialization

target:
  languages:
    - PHP
    - Python
    - JavaScript
    - Go

analysis:
  engine: AST
  behavior: SINK

match:
  language: Generic
  ast_node_types:
    - call

condition:
  symbol_triggers:
    - unserialize
    - pickle.loads
    - yaml.load
    - JSON.parse
  pattern: '(?i)(unserialize|pickle\.loads|yaml\.load|JSON\.parse)'

evidence:
  require: []
  score_weights:
    dangerous_sink: 30

output:
  severity: HIGH
  confidence: LIKELY
  message: Unsafe deserialization or unverified package loading detected.
  remediation: Validate payload signatures or use safe serialization formats (JSON, SafeLoader).
