rule:
  id: KS-OWASP-0001

metadata:
  references:
    - https://owasp.org/Top10/
  name: OWASP A01 - Broken Access Control (Multi-language)
  author: KarsaSec Team
  version: "1.1"
  cwe: CWE-284
  owasp: A01:2021-Broken Access Control
  created: "2026-08-05"
  updated: "2026-08-09"
  tags:
    - broken_access_control
    - authorization

target:
  languages:
    - PHP
    - Python
    - JavaScript
    - Go

analysis:
  engine: AST
  behavior: SINK

match:
  language: Generic
  ast_node_types:
    - call
    - assignment

condition:
  symbol_triggers:
    - setcookie
    - $_COOKIE
    - session
    - jwt
    - token
  pattern: '(?i)(setcookie\s*\(|\$_COOKIE\s*\[|session_start\s*\(|jwt_decode\s*\(|token\s*==|is_admin\s*=|is_authorized\s*=|access_denied|unauthorized)'
  node_text_not_matches: '(<[^>]+>|//|#\s|/\*|\*\s|<!--|\b(will|can|may|the|that|this|are|have|any|an|a|and|or|for|with|from|not|is|to|if|be|it|by)\b.*\b(cookie|session|token)\b|\b(cookie|session|token)\b.*\b(will|can|may|the|that|this|are|have|any|an|a|and|or|for|with|from|not|is|to|if|be|it|by)\b)'

evidence:
  require:
    - user_input
  score_weights:
    dangerous_sink: 20
    user_source: 20

output:
  severity: HIGH
  confidence: LIKELY
  message: Detects code paths making access control decisions based on request-controlled values or weak token checks.
  remediation: Use server-side authoritative identity checks and avoid using client-controlled cookies or request parameters for authorization.

