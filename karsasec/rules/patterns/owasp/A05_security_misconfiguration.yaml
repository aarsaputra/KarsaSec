rule:
  id: KS-OWASP-0005

metadata:
  name: OWASP A05 - Security Misconfiguration (Multi-language)
  author: KarsaSec Team
  version: "1.0"
  cwe: CWE-16
  owasp: A05:2021-Security Misconfiguration
  created: "2026-08-05"
  tags:
    - misconfiguration

target:
  languages:
    - PHP
    - Python
    - JavaScript
    - Go

analysis:
  engine: AST
  behavior: SINK

match:
  language: Generic
  ast_node_types:
    - assignment
    - call

condition:
  symbol_triggers:
    - display_errors
    - error_reporting
    - ini_set
    - debug
  pattern: '(?i)(display_errors|error_reporting|ini_set|DEBUG\s*=\s*True)'

evidence:
  require: []
  score_weights:
    dangerous_sink: 30

output:
  severity: MEDIUM
  confidence: LIKELY
  message: Detects enabled debug modes, verbose error output, or unhardened security flags.
  remediation: Disable debug features and verbose error reporting in production environments.
