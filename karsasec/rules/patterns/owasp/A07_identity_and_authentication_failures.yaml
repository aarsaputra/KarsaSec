rule:
  id: KS-OWASP-0007

metadata:
  references:
    - https://owasp.org/Top10/
  name: OWASP A07 - Identification and Authentication Failures (Multi-language)
  author: KarsaSec Team
  version: "1.0"
  cwe: CWE-287
  owasp: A07:2021-Identification and Authentication Failures
  created: "2026-08-05"
  tags:
    - authentication

target:
  languages:
    - PHP
    - Python
    - JavaScript
    - Go

analysis:
  engine: GENERIC
  behavior: SINK

match:
  language: Generic
  ast_node_types:
    - call
    - statement

condition:
  symbol_triggers:
    - password
    - bcrypt
    - compare_hash
  pattern: '(?i)(password|bcrypt|verify_password|check_password|login|authenticate)'
  node_text_not_matches: '(?i)\b(api|axios|fetch|http|client|request|httpClient|service)\s*\.\s*(post|put|get|patch|delete|request)\b'
  value_evidence_not_in:
    - ENV_REFERENCE
    - SECRET_PROVIDER_REFERENCE
    - EMPTY_LITERAL
    - NULL_LITERAL
    - STATIC_CONSTANT

evidence:
  require:
    - user_input

output:
  severity: HIGH
  confidence: LIKELY
  message: Detects potential insecure authentication handling or suspicious password operations.
  remediation: Use proven authentication frameworks, secure password storage and multifactor when applicable.
