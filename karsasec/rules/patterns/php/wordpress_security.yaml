rules:
  - rule:
      id: KS-PHP-0024
    metadata:
      name: WordPress Unprepared $wpdb Query SQL Injection
      author: KarsaSec Team
      version: "1.0"
      cwe: CWE-89
      owasp: A03:2021-Injection
      created: "2026-08-06"
      references:
        - https://cwe.mitre.org/data/definitions/89.html
      tags:
        - sqli
        - wordpress
        - wpdb
    target:
      languages:
        - PHP
    analysis:
      engine: AST
      behavior: SINK
    match:
      language: PHP
      ast_node_types:
        - call
    condition:
      symbol_triggers:
        - $wpdb
        - query
        - get_results
      pattern: "(?i)\\$wpdb->(query|get_results|get_var|get_row)\\s*\\([^)]*\\$(?:_GET|_POST|_REQUEST)"
    evidence:
      require:
        - user_input
      score_weights:
        dangerous_sink: 50
        user_source: 30
    output:
      severity: HIGH
      confidence: CONFIDENT
      message: Executing $wpdb database queries directly with request parameters without $wpdb->prepare() permits SQL injection.
      remediation: Wrap dynamic query arguments using $wpdb->prepare("SELECT ... %s", $val).

  - rule:
      id: KS-PHP-0025
    metadata:
      name: WordPress Missing Nonce CSRF Verification
      author: KarsaSec Team
      version: "1.0"
      cwe: CWE-352
      owasp: A01:2021-Broken Access Control
      created: "2026-08-06"
      references:
        - https://cwe.mitre.org/data/definitions/352.html
      tags:
        - csrf
        - wordpress
        - wp_ajax
    target:
      languages:
        - PHP
    analysis:
      engine: AST
      behavior: SINK
    match:
      language: PHP
      ast_node_types:
        - call
    condition:
      symbol_triggers:
        - add_action
        - wp_ajax
      pattern: "(?i)add_action\\s*\\(\\s*[\"']wp_ajax_(?:nopriv_)?[^\"']+[\"']"
    evidence:
      score_weights:
        dangerous_sink: 30
    output:
      severity: MEDIUM
      confidence: LIKELY
      message: Registering AJAX actions without wp_verify_nonce() or check_admin_referer() leaves endpoint susceptible to CSRF.
      remediation: Verify nonces using wp_verify_nonce($_REQUEST['_wpnonce'], 'action_name') at the start of AJAX handlers.
