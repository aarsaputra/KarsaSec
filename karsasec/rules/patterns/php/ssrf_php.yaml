rule:
  id: KS-PHP-SSRF-0001

metadata:
  references:
    - https://owasp.org/Top10/
  name: PHP SSRF - PHP-Specific Outbound Request Vectors
  author: KarsaSec Team
  version: "1.1"
  cwe: CWE-918
  owasp: A10:2021-Server-Side Request Forgery
  created: "2026-08-05"
  updated: "2026-08-09"
  tags:
    - ssrf

target:
  languages:
    - PHP

analysis:
  engine: AST
  behavior: SINK

match:
  language: PHP
  ast_node_types:
    - call

condition:
  symbol_triggers:
    - curl_setopt
    - CURLOPT_URL
  # Scope: PHP-specific SSRF vectors NOT covered by KS-OWASP-0010.
  # Intentional overlap = 0. file_get_contents/curl_exec are owned by KS-OWASP-0010.
  pattern: '(?i)(curl_setopt\s*\(\s*\$[a-z_]+\s*,\s*CURLOPT_URL)'

evidence:
  require:
    - user_input
  score_weights:
    dangerous_sink: 40

output:
  severity: HIGH
  confidence: LIKELY
  message: Detects curl_setopt(CURLOPT_URL) with potentially user-controlled URL — PHP-specific SSRF vector.
  remediation: Whitelist destination hosts and validate URLs before passing to curl_setopt. Block private/internal network ranges.

contract:
  detection:
    source_kind: php_curl_url_assignment
    semantic_context: >
      curl_setopt(CURLOPT_URL, $user_input) allows attacker to control outbound
      HTTP destination. PHP-specific vector not covered by generic KS-OWASP-0010.

  safety:
    safe_evidence:
      - STATIC_CONSTANT
    unknown_evidence:
      - UNKNOWN
    unknown_resolution: SUPPRESS

  fixtures:
    positive:
      - "curl_setopt($ch, CURLOPT_URL, $user_url);"
      - "curl_setopt($ch, CURLOPT_URL, $_GET['target']);"
    negative:
      - "curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);"
      - "curl_exec($ch);"
      - "file_get_contents($url);"

  regression:
    fp_regression_ids:
      - SSRF-OVERLAP-001
    regression_context: >
      Previously overlapped with KS-OWASP-0010 on file_get_contents and curl_exec.
      Now scoped exclusively to curl_setopt(CURLOPT_URL) — the PHP-specific vector
      not covered by the generic OWASP rule. Zero intentional overlap enforced.
