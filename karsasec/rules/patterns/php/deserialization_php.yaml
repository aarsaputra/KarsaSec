rule:
  id: KS-PHP-DESER-0001

metadata:
  name: PHP Insecure Deserialization
  author: KarsaSec Team
  version: "1.0"
  cwe: CWE-502
  owasp: A08:2021-Insecure Deserialization
  created: "2026-08-05"
  tags:
    - deserialization

target:
  languages:
    - PHP

analysis:
  engine: AST
  behavior: SINK

match:
  language: PHP
  ast_node_types:
    - call
    - statement

condition:
  symbol_triggers:
    - unserialize
    - igbinary_unserialize
  pattern: >-
    (?i)(unserialize\(|igbinary_unserialize\()

evidence:
  require:
    - user_input
  score_weights:
    dangerous_sink: 40

output:
  severity: HIGH
  confidence: CONFIDENT
  message: Detects deserialization of potentially untrusted PHP serialized data.
  remediation: Avoid unserialize on untrusted data; use json_decode or safe parsers instead.
