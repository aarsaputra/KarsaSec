rule:
  id: KS-PHP-0005

metadata:
  name: PHP Remote File Inclusion (RFI)
  author: KarsaSec Team
  version: "2.0"
  cwe: CWE-98
  owasp: A03:2021-Injection
  created: "2026-08-05"
  references:
    - https://cwe.mitre.org/data/definitions/98.html
  tags:
    - rfi
    - include
    - php

target:
  languages:
    - PHP

analysis:
  engine: AST
  behavior: SINK

match:
  language: PHP
  ast_node_types:
    - function_call_expression
    - call_expression
    - statement
    - call

condition:
  symbol_triggers:
    - allow_url_include
    - include
    - require
  pattern: "(?i)(include|require)\\s*\\(?\\s*[\"']https?://"

evidence:
  require: []
  score_weights:
    dangerous_sink: 50

output:
  severity: CRITICAL
  confidence: CONFIDENT
  message: Detects HTTP/HTTPS remote URL inclusion in PHP include or require statements.
  remediation: Disable allow_url_include in php.ini and only allow local file inclusion.
