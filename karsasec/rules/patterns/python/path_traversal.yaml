rule:
  id: KS-PY-0011

metadata:
  name: Python Path Traversal
  author: KarsaSec Team
  version: "2.0"
  cwe: CWE-22
  owasp: A01:2021-Broken Access Control
  created: "2026-08-05"
  references:
    - https://cwe.mitre.org/data/definitions/22.html
  tags:
    - path_traversal
    - filesystem
    - python

target:
  languages:
    - Python

analysis:
  engine: AST
  behavior: SINK

match:
  language: Python
  ast_node_types:
    - call

condition:
  symbol_triggers:
    - open
    - send_file
    - send_from_directory
  pattern: "(?i)(open\\(|send_file\\(|send_from_directory\\(|os\\.path\\.join\\()"

evidence:
  require:
    - user_input
  score_weights:
    dangerous_sink: 40
    user_source: 30

output:
  severity: HIGH
  confidence: CONFIDENT
  message: Detects file system access using unsanitized file paths, allowing path traversal attacks.
  remediation: Sanitize inputs using os.path.basename or validate against an allowed directory path.
