rule:
  id: KS-PY-0003

metadata:
  name: Python Unsafe Deserialization
  author: KarsaSec Team
  version: "2.0"
  cwe: CWE-502
  owasp: A08:2021-Integrity
  created: "2026-08-05"
  references:
    - https://cwe.mitre.org/data/definitions/502.html
  tags:
    - deserialization
    - pickle
    - integrity

target:
  languages:
    - Python

analysis:
  engine: AST
  behavior: SINK

match:
  language: Python
  ast_node_types:
    - call

condition:
  symbol_triggers:
    - pickle.loads
    - pickle.load
    - _pickle.loads
    - _pickle.load
    - yaml.load

evidence:
  require:
    - untrusted_input
  score_weights:
    dangerous_sink: 50

output:
  severity: CRITICAL
  confidence: CONFIDENT
  message: Detects insecure deserialization calls capable of executing arbitrary code.
  remediation: Avoid un-pickling untrusted data. Use json.loads or yaml.safe_load.
