predicate:
  name: hardcoded_secret
  version: "1.0.0"
  description: Shared Hardcoded Secret detection patterns.
  metadata:
    cwe: CWE-798
    owasp: A07:2021-Identification and Authentication Failures
    severity: HIGH
    confidence: CONFIDENT
  sources: []
  sinks:
    - SECRET_KEY
    - JWT_SECRET
    - API_KEY
    - PASSWORD
  sanitizers: []
  condition:
    symbol_triggers:
      - SECRET_KEY
      - JWT_SECRET
      - API_KEY
      - password
    pattern: "(?i)(?:SECRET_KEY|JWT_SECRET|API_KEY|password)\\s*=\\s*[\"'][^\"']{4,}[\"']"
