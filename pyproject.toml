[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karsasec"
version = "0.1.0"
description = "Autonomous Application Security Operating System (SecOS)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "KarsaSec Core Team", email = "dev@karsasec.ai" }
]
keywords = ["security", "sast", "schedules", "appsec", "static-analysis", "ai-agents", "security-scanner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "tree-sitter>=0.22.0",
    "pyyaml>=6.0.1",
    "litellm>=1.35.0",
    "sqlite3-api; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
karsasec = "karsasec.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["karsasec"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501", "B904", "E741", "B008", "B007", "B027", "E402", "F841", "I001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["tree_sitter.*", "litellm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
